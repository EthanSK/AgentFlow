# Bounded read-only hosted environment diagnosis; no release or user input. — GPT-6.1 Sol
name: Inspect hosted recorder animation environment
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Read AppKit animation environment
        run: |
          swift - <<'SWIFT'
          import AppKit
          import Foundation
          _ = NSApplication.shared
          print("os=\(ProcessInfo.processInfo.operatingSystemVersionString)")
          print("reduceMotion=\(NSWorkspace.shared.accessibilityDisplayShouldReduceMotion)")
          print("screens=\(NSScreen.screens.count)")
          let animations = UserDefaults.standard.object(forKey: "NSAutomaticWindowAnimationsEnabled")
          print("windowAnimations=\(String(describing: animations))")
          SWIFT

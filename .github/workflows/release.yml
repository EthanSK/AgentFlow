# Trusted main releases build, test and sign on GitHub's disposable Mac. — GPT-6.1 Sol
name: Release signed Agent Flow
on:
  push:
    branches: [main]
    paths: ['VoiceInk/**', 'VoiceInkTests/**', 'VoiceInk.xcodeproj/**', 'scripts/*release*', '.github/workflows/release.yml', 'LocalBuild.xcconfig']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentflow-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      AGENTFLOW_NOTARY_PROFILE: ReleaseCI
      SPARKLE_ACCOUNT: com.ethansk.AgentFlow
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Show the selected Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
          # Preserve the native motion policy beside each hosted qualification. — GPT-6.1 Sol
          swift -e 'import AppKit; print("RecorderFadeDiagnostic systemReduceMotion=\(NSWorkspace.shared.accessibilityDisplayShouldReduceMotion)")'
      - name: Prepare pinned speech dependency
        run: make check whisper
      - name: Fetch verified Sparkle tools
        run: |
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  '"$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/Sparkle.noindex"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle.noindex"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/Sparkle.noindex/bin" >> "$GITHUB_ENV"
      - name: Prepare temporary signing credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: bash scripts/prepare-hosted-signing.sh
      - name: Sign, notarize and publish immutable updates
        run: |
          export AGENTFLOW_BUILD_HOST="$(hostname)"
          bash scripts/package-public-release.sh "$RUNNER_TEMP/AgentFlow.noindex" --complete
          # Publish with this workflow's scoped token. — GPT-6.1 Sol
          bash scripts/publish-public-release.sh "$RUNNER_TEMP/AgentFlow.noindex"
      - name: Verify the published download
        run: |
          tag=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("v"+d["version"]+"."+d["build"])' "$RUNNER_TEMP/AgentFlow.noindex/release.json")
          gh release download "$tag" --dir "$RUNNER_TEMP/downloaded.noindex"
          cd "$RUNNER_TEMP/downloaded.noindex"
          shasum -a 256 -c SHA256SUMS
      - name: Remove temporary signing credentials
        if: always()
        run: |
          rm -f "${RELEASE_CERTIFICATE:-}" "${RELEASE_SPARKLE_KEY:-}"
          if [[ -n "${RELEASE_KEYCHAIN:-}" && -f "$RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
      # Retain only public-source test evidence, never signing files or a whole
      # temporary directory. Missing hosted catalogue bytes hid the format error.
      # Found and fixed by GPT-6.1 Sol.
      - name: Retain release test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/AgentFlow.noindex/xcode-recorder-tests.log
            ${{ runner.temp }}/AgentFlow.noindex/xcode-remaining-tests.log
            ${{ runner.temp }}/AgentFlow.noindex/xcode-test-discovery.log
            ${{ runner.temp }}/AgentFlow.noindex/test-catalog.json
            ${{ runner.temp }}/AgentFlow.noindex/native-test-results.json
            ${{ runner.temp }}/AgentFlow.noindex/remaining-test-results.json
            ${{ runner.temp }}/AgentFlow.noindex/qualified-tests.json
